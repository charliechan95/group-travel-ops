<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行團房間＋訂金管理</title>
<link rel="stylesheet" href="style.css">
<style>
  .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .tabs button { border: 1px solid transparent; background: transparent; color: #d8d2c4; }
  .tabs button.active { background: #3a322a; color: #fff; }
  .view { display: none; }
  .view.active { display: block; }
  .row-actions { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .row-actions button, .row-actions a { padding: 0.3rem 0.6rem; font-size: 0.85rem; }
  .row-actions a { text-decoration: none; border: 1px solid var(--line); border-radius: 8px; background: #e8f5e9; color: var(--green); font-weight: 600; }
  .pill-deposit { background: #fdf3d7; color: #8a6d00; }
  .pill-paid { background: var(--green-soft); color: var(--green); }
  .pill-unpaid { background: var(--red-soft); color: var(--red); }
  .form label { display: block; margin-bottom: 0.6rem; max-width: 480px; }
  .form input, .form select, .form textarea { width: 100%; margin-top: 0.25rem; }
  .form .inline { display: flex; gap: 0.6rem; }
  .form .inline label { flex: 1; }
  .room-box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.8rem 1rem; margin-bottom: 0.8rem; }
  .room-box h3 { margin: 0 0 0.4rem; }
  .member-chip { display: inline-block; background: var(--accent-soft); border-radius: 999px; padding: 0.2rem 0.7rem; margin: 0.15rem; font-size: 0.88rem; }
  .member-chip button { border: none; background: none; color: var(--red); cursor: pointer; margin-left: 0.3rem; font-weight: 700; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">🧳 旅行團管理</div>
  <nav class="tabs">
    <button data-tab="tours" class="active">團</button>
    <button data-tab="members">團員</button>
    <button data-tab="rooms">房間</button>
    <button data-tab="settings">設定</button>
  </nav>
</header>
<main class="container">

  <div class="toolbar">
    <label>選擇旅行團：
      <select id="tour-select" style="min-width:220px"></select>
    </label>
    <button id="btn-tour-new">＋ 新增旅行團</button>
  </div>

  <!-- Tours dashboard -->
  <section id="view-tours" class="view active">
    <h1 id="tour-title">團概覽</h1>
    <section class="cards">
      <div class="card"><div class="card-num" id="st-count">0</div><div class="card-label">團員人數</div></div>
      <div class="card"><div class="card-num" id="st-collected">0</div><div class="card-label">已收款 (HKD)</div></div>
      <div class="card"><div class="card-num" id="st-outstanding">0</div><div class="card-label">尚欠 (HKD)</div></div>
      <div class="card"><div class="card-num" id="st-unpaid">0</div><div class="card-label">未付人數</div></div>
      <div class="card"><div class="card-num" id="st-rooms">0</div><div class="card-label">房間數</div></div>
    </section>
    <div class="row-actions" style="margin-top:1rem">
      <button id="btn-tour-edit">✏️ 編輯此團</button>
      <button id="btn-tour-delete" style="color:var(--red)">🗑 刪除此團</button>
    </div>
  </section>

  <!-- Members -->
  <section id="view-members" class="view">
    <h1>團員名單</h1>
    <div class="toolbar">
      <button id="btn-member-new">＋ 新增團員</button>
    </div>
    <table class="tbl"><thead><tr>
      <th>姓名</th><th>電話</th><th>團費</th><th>已付</th><th>尚欠</th><th>狀態</th><th>房間</th><th>操作</th>
    </tr></thead><tbody id="member-rows"></tbody></table>
  </section>

  <!-- Rooms -->
  <section id="view-rooms" class="view">
    <h1>房間編排</h1>
    <div class="toolbar">
      <button id="btn-room-new">＋ 新增房間</button>
    </div>
    <div id="room-list"></div>
    <h2>未編房團員</h2>
    <div id="unassigned-list"></div>
  </section>

  <!-- Settings -->
  <section id="view-settings" class="view">
    <h1>設定</h1>
    <form id="frm-settings" class="form">
      <label>公司／操作員名稱<input id="set-operator" name="operator_name"></label>
      <label>FPS 轉數 ID<input id="set-fps-id" name="fps_id"></label>
      <label>FPS 登記姓名<input id="set-fps-name" name="fps_name"></label>
      <label>WhatsApp 追款訊息<textarea id="set-chase" name="chase_message" rows="4"></textarea>
      <div class="muted">可用變數：{operator} {tour} {price} {deposit} {due} {fps_id} {fps_name}</div>
      <div style="margin-top:0.8rem"><button type="submit">儲存設定</button></div>
    </form>
  </section>

  <!-- Tour dialog -->
  <dialog id="dlg-tour">
    <form method="dialog" id="frm-tour" class="form">
      <h2 id="dlg-tour-title">新增旅行團</h2>
      <input type="hidden" id="tour-id" name="id">
      <label>團名<input id="tour-name" name="name" required></label>
      <label>目的地<input id="tour-dest" name="destination"></label>
      <div class="inline">
        <label>出發日期<input id="tour-start" name="start_date" type="date"></label>
        <label>回程日期<input id="tour-end" name="end_date" type="date"></label>
      </div>
      <div class="inline">
        <label>每人團費 (HKD)<input id="tour-price" name="price_per_person" type="number" min="0" step="1"></label>
        <label>每人訂金 (HKD)<input id="tour-deposit" name="deposit_per_person" type="number" min="0" step="1"></label>
      </div>
      <div class="row-actions"><button id="btn-tour-save" value="default">儲存</button>
      <button value="cancel" formnovalidate>取消</button></div>
    </form>
  </dialog>

  <!-- Member dialog -->
  <dialog id="dlg-member">
    <form method="dialog" id="frm-member" class="form">
      <h2 id="dlg-member-title">新增團員</h2>
      <input type="hidden" id="member-id" name="id">
      <label>姓名<input id="member-name" name="name" required></label>
      <label>電話<input id="member-phone" name="phone" placeholder="8位數字"></label>
      <div class="inline">
        <label>團費 (HKD)<input id="member-price" name="price" type="number" min="0" step="1"></label>
        <label>已付金額 (HKD)<input id="member-paid" name="deposit_paid" type="number" min="0" step="1"></label>
      </div>
      <label>備註<textarea id="member-notes" name="notes" rows="2"></textarea></label>
      <div class="row-actions"><button id="btn-member-save" value="default">儲存</button>
      <button value="cancel" formnovalidate>取消</button></div>
    </form>
  </dialog>

  <!-- Room dialog -->
  <dialog id="dlg-room">
    <form method="dialog" id="frm-room" class="form">
      <h2>新增房間</h2>
      <label>房號／標籤<input id="room-label" name="label" required placeholder="例：301"></label>
      <label>房型<select id="room-type" name="type">
        <option>Twin</option><option>Double</option><option>Single</option><option>Triple</option>
      </select></label>
      <div class="row-actions"><button id="btn-room-save" value="default">儲存</button>
      <button value="cancel" formnovalidate>取消</button></div>
    </form>
  </dialog>

  <!-- Payment dialog -->
  <dialog id="dlg-pay">
    <form method="dialog" id="frm-pay" class="form">
      <h2>記錄付款</h2>
      <p class="muted" id="pay-info"></p>
      <label>金額 (HKD)<input id="pay-amount" type="number" min="0" step="1" required></label>
      <div class="row-actions"><button id="btn-pay-save" value="default">儲存</button>
      <button value="cancel" formnovalidate>取消</button></div>
    </form>
  </dialog>

</main>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
